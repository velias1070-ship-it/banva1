// ============================================================
// Barcode Code128 Generator (pure JS)
// ============================================================
const Code128 = (() => {
  const PATTERNS = [
    "11011001100","11001101100","11001100110","10010011000","10010001100",
    "10001001100","10011001000","10011000100","10001100100","11001001000",
    "11001000100","11000100100","10110011100","10011011100","10011001110",
    "10111001100","10011101100","10011100110","11001110010","11001011100",
    "11001001110","11011100100","11001110100","11100101100","11100100110",
    "11101100100","11100110100","11100110010","11011011000","11011000110",
    "11000110110","10100011000","10001011000","10001000110","10110001000",
    "10001101000","10001100010","11010001000","11000101000","11000100010",
    "10110111000","10110001110","10001101110","10111011000","10111000110",
    "10001110110","11101110110","11010001110","11000101110","11011101000",
    "11011100010","11011101110","11101011000","11101000110","11100010110",
    "11101101000","11101100010","11100011010","11101111010","11001000010",
    "11110001010","10100110000","10100001100","10010110000","10010000110",
    "10000101100","10000100110","10110010000","10110000100","10011010000",
    "10011000010","10000110100","10000110010","11000010010","11001010000",
    "11110111010","11000010100","10001111010","10100111100","10010111100",
    "10010011110","10111100100","10011110100","10011110010","11110100100",
    "11110010100","11110010010","11011011110","11011110110","11110110110",
    "10101111000","10100011110","10001011110","10111101000","10111100010",
    "11110101000","11110100010","10111011110","10111101110","11101011110",
    "11110101110","11010000100","11010010000","11010011100","1100011101011"
  ];
  
  function encode(text) {
    let codes = [104]; // Start B
    let checksum = 104;
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i) - 32;
      codes.push(code);
      checksum += code * (i + 1);
    }
    codes.push(checksum % 103);
    codes.push(106); // Stop
    return codes.map(c => PATTERNS[c]).join("");
  }
  
  function toSVG(text, width = 200, height = 50) {
    const bits = encode(text);
    const barWidth = width / bits.length;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
    svg += `<rect width="${width}" height="${height}" fill="white"/>`;
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] === "1") {
        svg += `<rect x="${i * barWidth}" y="0" width="${barWidth + 0.5}" height="${height}" fill="black"/>`;
      }
    }
    svg += `</svg>`;
    return svg;
  }
  
  return { encode, toSVG };
})();

// ============================================================
// Category extractor from product name
// ============================================================
function extractCategory(nombre) {
  const n = (nombre || "").toLowerCase();
  if (n.includes("sabana") && n.includes("af") && n.includes("144")) return "Jgo Sabanas AF 144H";
  if (n.includes("sabana") && n.includes("cn") && n.includes("200")) return "Jgo Sabanas CN 200H";
  if (n.includes("sabana") && n.includes("ec") && n.includes("200")) return "Jgo Sabanas EC 200H";
  if (n.includes("sabana") && n.includes("300")) return "Jgo Sabanas 300H";
  if (n.includes("sabana") && n.includes("144")) return "Jgo Sabanas 144H";
  if (n.includes("sabana")) return "Jgo Sabanas";
  if (n.includes("quilt") && n.includes("atenas")) return "Quilt Atenas";
  if (n.includes("quilt") && n.includes("bruselas")) return "Quilt Bruselas";
  if (n.includes("quilt") && n.includes("roma")) return "Quilt Roma";
  if (n.includes("quilt") && n.includes("bicolor")) return "Quilt Bicolor";
  if (n.includes("quilt")) return "Quilt";
  if (n.includes("cubrecama")) return "Cubrecamas";
  if (n.includes("plumon") && n.includes("infantil")) return "Plumon Infantil";
  if (n.includes("plumon")) return "Plumon";
  if (n.includes("almohada")) return "Almohadas";
  if (n.includes("toalla")) return "Toallas";
  if (n.includes("manta")) return "Mantas";
  if (n.includes("alfombra") && n.includes("infantil")) return "Alfombra Infantil";
  if (n.includes("alfombra")) return "Alfombras";
  if (n.includes("limpiapies") || n.includes("limpia pies")) return "Limpiapies";
  if (n.includes("frise") || n.includes("heatset")) return "Frise/Heatset";
  if (n.includes("cortina")) return "Cortinas";
  if (n.includes("topper")) return "Topper";
  if (n.includes("protector")) return "Protectores";
  return "Otros";
}

// ============================================================
// PDF Generator - Exact format matching Vicente's labels
// ============================================================
function generateLabelsPDF(products, folioFactura) {
  return new Promise((resolve) => {
    const LABEL_W = 709;  // 60mm at 300dpi
    const LABEL_H = 472;  // 40mm at 300dpi
    const MM = LABEL_W / 60;
    
    // Sort products by category then name
    const sorted = [...products].sort((a, b) => {
      const catA = extractCategory(a.nombreDict || a.nombre || "");
      const catB = extractCategory(b.nombreDict || b.nombre || "");
      if (catA !== catB) return catA.localeCompare(catB);
      return (a.nombre || "").localeCompare(b.nombre || "");
    });
    
    const pages = [];
    let currentCategory = null;
    
    for (const product of sorted) {
      if (!product.codigoML || product.cantidad <= 0) continue;
      
      const nombre = product.nombreDict || product.nombre || "";
      const category = extractCategory(nombre);
      
      // ---- CATEGORY SEPARATOR ----
      if (category !== currentCategory) {
        currentCategory = category;
        const canvas = document.createElement("canvas");
        canvas.width = LABEL_W;
        canvas.height = LABEL_H;
        const ctx = canvas.getContext("2d");
        
        // Gray background
        ctx.fillStyle = "#E8E8E8";
        ctx.fillRect(0, 0, LABEL_W, LABEL_H);
        
        // Category name centered
        ctx.fillStyle = "#000000";
        ctx.font = `bold ${5 * MM}px Arial, Helvetica, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(category, LABEL_W / 2, LABEL_H / 2);
        
        pages.push({ type: "separator-category", data: canvas.toDataURL("image/png") });
      }
      
      // ---- PRODUCT SEPARATOR ----
      {
        const canvas = document.createElement("canvas");
        canvas.width = LABEL_W;
        canvas.height = LABEL_H;
        const ctx = canvas.getContext("2d");
        
        // Light blue background
        ctx.fillStyle = "#DCE8F5";
        ctx.fillRect(0, 0, LABEL_W, LABEL_H);
        
        // Product name at top
        ctx.fillStyle = "#000000";
        ctx.font = `bold ${2.8 * MM}px Arial, Helvetica, sans-serif`;
        ctx.textAlign = "center";
        
        // Wrap name if too long
        let displayName = nombre;
        if (displayName.length > 50) {
          const mid = displayName.lastIndexOf(" ", 50);
          const line1 = displayName.substring(0, mid > 0 ? mid : 50);
          const line2 = displayName.substring(mid > 0 ? mid + 1 : 50);
          ctx.fillText(line1, LABEL_W / 2, LABEL_H * 0.28);
          ctx.fillText(line2, LABEL_W / 2, LABEL_H * 0.28 + 3.5 * MM);
        } else {
          ctx.fillText(displayName, LABEL_W / 2, LABEL_H * 0.3);
        }
        
        // Quantity big and bold
        ctx.font = `bold ${8 * MM}px Arial, Helvetica, sans-serif`;
        ctx.fillText(`${product.cantidad} unidades`, LABEL_W / 2, LABEL_H * 0.68);
        
        pages.push({ type: "separator-product", data: canvas.toDataURL("image/png") });
      }
      
      // ---- ACTUAL LABELS (one per unit) ----
      for (let i = 0; i < product.cantidad; i++) {
        const canvas = document.createElement("canvas");
        canvas.width = LABEL_W;
        canvas.height = LABEL_H;
        const ctx = canvas.getContext("2d");
        
        // White background
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, LABEL_W, LABEL_H);
        
        // Generate barcode using JsBarcode on a temp canvas
        const bcCanvas = document.createElement("canvas");
        try {
          JsBarcode(bcCanvas, product.codigoML, {
            format: "CODE128",
            width: 3,
            height: 150,
            displayValue: false,
            margin: 0,
            background: "#FFFFFF",
            lineColor: "#000000"
          });
        } catch(e) {
          console.error("Barcode error:", e);
        }
        
        // Draw barcode centered on label
        const bcTargetW = 52 * MM;
        const bcTargetH = 12 * MM;
        const bcX = (LABEL_W - bcTargetW) / 2;
        const bcY = 1.5 * MM;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(bcCanvas, bcX, bcY, bcTargetW, bcTargetH);
        ctx.imageSmoothingEnabled = true;
        
        // Código ML big below barcode
        ctx.fillStyle = "#000000";
        ctx.font = `bold ${5 * MM}px Arial, Helvetica, sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(product.codigoML, LABEL_W / 2, 17.5 * MM);
        
        // Separator line
        ctx.strokeStyle = "#CCCCCC";
        ctx.lineWidth = 0.3 * MM;
        ctx.beginPath();
        ctx.moveTo(4 * MM, 19.5 * MM);
        ctx.lineTo(LABEL_W - 4 * MM, 19.5 * MM);
        ctx.stroke();
        
        // Product name
        ctx.font = `${2.3 * MM}px Arial, Helvetica, sans-serif`;
        ctx.fillStyle = "#000000";
        let labelName = nombre;
        if (labelName.length > 48) {
          const mid = labelName.lastIndexOf(" ", 48);
          const l1 = labelName.substring(0, mid > 0 ? mid : 48);
          const l2 = labelName.substring(mid > 0 ? mid + 1 : 48);
          if (l2.length > 48) {
            ctx.fillText(l1, LABEL_W / 2, 22.5 * MM);
            ctx.fillText(l2.substring(0, 48) + "...", LABEL_W / 2, 25.5 * MM);
          } else {
            ctx.fillText(l1, LABEL_W / 2, 22.5 * MM);
            ctx.fillText(l2, LABEL_W / 2, 25.5 * MM);
          }
        } else {
          ctx.fillText(labelName, LABEL_W / 2, 23.5 * MM);
        }
        
        // Separator line before SKU
        ctx.beginPath();
        ctx.moveTo(4 * MM, 28.5 * MM);
        ctx.lineTo(LABEL_W - 4 * MM, 28.5 * MM);
        ctx.stroke();
        
        // Cod. Universal: SKU at bottom
        ctx.font = `bold ${2.8 * MM}px Arial, Helvetica, sans-serif`;
        ctx.fillText(`Cod. Universal: ${product.skuVenta || product.sku || ""}`, LABEL_W / 2, 32.5 * MM);
        
        // Folio tiny at bottom-right
        if (folioFactura) {
          ctx.font = `${1.5 * MM}px Arial, Helvetica, sans-serif`;
          ctx.textAlign = "right";
          ctx.fillStyle = "#999999";
          ctx.fillText(`F:${folioFactura}`, LABEL_W - 3 * MM, LABEL_H - 1.5 * MM);
        }
        
        pages.push({ type: "label", data: canvas.toDataURL("image/png") });
      }
    }
    
    resolve(pages);
  });
}

// Main App Component
// ============================================================
function App() {
  // XLSX loader
  const loadXLSX = useCallback(() => {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve(window.XLSX);
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => resolve(window.XLSX);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }, []);

  const [step, setStep] = useState("upload");
  const [invoiceImage, setInvoiceImage] = useState(null);
  const [invoiceImageBase64, setInvoiceImageBase64] = useState(null);
  const [extractedProducts, setExtractedProducts] = useState([]);
  const [folioFactura, setFolioFactura] = useState("");
  const [dictionary, setDictionary] = useState([]);
  const [hasDictionary, setHasDictionary] = useState(false);
  const [processing, setProcessing] = useState(false);
  const [processingStatus, setProcessingStatus] = useState("");

  // Admin mode
  const ADMIN_PIN = "1234"; // Cambia esto a tu PIN
  const [isAdmin, setIsAdmin] = useState(false);
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [productSearchIdx, setProductSearchIdx] = useState(null);
  const [productSearchQuery, setProductSearchQuery] = useState("");
  const [pasteText, setPasteText] = useState("");
  const [showPasteMode, setShowPasteMode] = useState(false);
  const [showVerifyMode, setShowVerifyMode] = useState(false);
  const [verifyResult, setVerifyResult] = useState(null); // {found, product, scannedCode}
  const [scannerActive, setScannerActive] = useState(false);
  const scannerRef = useRef(null);
  const html5QrCodeRef = useRef(null);
  const [labelPages, setLabelPages] = useState([]);
  const [error, setError] = useState(null);
  const [editingIdx, setEditingIdx] = useState(null);
  const fileInputRef = useRef(null);
  const dictInputRef = useRef(null);
  const [dictText, setDictText] = useState("");
  const [showDictModal, setShowDictModal] = useState(false);
  const [unmatchedProducts, setUnmatchedProducts] = useState([]);
  const [quickSearch, setQuickSearch] = useState("");
  const [quickItems, setQuickItems] = useState([]);
  const quickSearchRef = useRef(null);
  const [sheetUrl, setSheetUrl] = useState("");
  const [sheetLoading, setSheetLoading] = useState(false);
  const [sheetStatus, setSheetStatus] = useState(""); // "ok", "error", ""
  const [lastSync, setLastSync] = useState("");
  const [showCatSeparators, setShowCatSeparators] = useState(true);
  const [showProdSeparators, setShowProdSeparators] = useState(true);
  const lastSyncTime = useRef(0);
  
  // Parse CSV text into dictionary array
  // Format: Col A=SKU Venta, B=Código ML, C=Nombre, D=?, E=SKU Proveedor, F=Cant Pack
  const parseCSV = useCallback((text) => {
    const lines = text.split("\n").filter(l => l.trim());
    const dict = [];
    
    for (let i = 0; i < lines.length; i++) {
      let parts;
      // Handle CSV with quotes
      if (lines[i].includes('"')) {
        parts = [];
        let current = "";
        let inQuotes = false;
        for (const ch of lines[i]) {
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { parts.push(current.trim()); current = ""; }
          else { current += ch; }
        }
        parts.push(current.trim());
      } else if (lines[i].includes("\t")) { parts = lines[i].split("\t"); }
      else if (lines[i].includes(";")) { parts = lines[i].split(";"); }
      else { parts = lines[i].split(","); }
      
      parts = parts.map(p => p.trim());
      
      // Skip header row
      if (i === 0 && (parts[0]?.toLowerCase().includes("sku") || parts[0]?.toLowerCase().includes("codigo"))) continue;
      
      // Detect format: if 5+ columns, use Sheet format (A=skuVenta, B=codigoML, C=nombre, E=skuProveedor, F=cantPack)
      if (parts.length >= 5) {
        const skuVenta = parts[0] || "";
        const codigoML = parts[1] || "";
        const nombre = parts[2] || "";
        const skuProveedor = parts[4] || "";
        const cantPack = parseInt(parts[5]) || 1;
        
        if (codigoML) {
          dict.push({ 
            sku: skuProveedor || skuVenta,  // SKU proveedor for invoice matching
            skuVenta: skuVenta,              // SKU venta for label "Cod. Universal"
            codigoML, 
            nombre,
            cantPack,
            isPack: cantPack > 1
          });
        }
      } else if (parts.length >= 2) {
        // Simple format: SKU, Código ML, Nombre
        const sku = parts[0];
        const codigoML = parts[1];
        const nombre = parts.length > 2 ? parts[2] : "";
        if (sku && codigoML) dict.push({ sku, skuVenta: sku, codigoML, nombre, cantPack: 1, isPack: false });
      }
    }
    return dict;
  }, []);

  // Fetch dictionary from Google Sheet
  const fetchFromSheet = useCallback(async (url) => {
    if (!url) return;
    setSheetLoading(true);
    setSheetStatus("");
    try {
      // Add cache-busting parameter to bypass Google's CSV cache
      const cacheBuster = url.includes("?") ? `&_t=${Date.now()}` : `?_t=${Date.now()}`;
      const res = await fetch(url + cacheBuster, { cache: "no-store" });
      if (!res.ok) throw new Error("No se pudo acceder al Sheet");
      const text = await res.text();
      const dict = parseCSV(text);
      if (dict.length === 0) throw new Error("No se encontraron productos en el Sheet");
      
      setDictionary(dict);
      setHasDictionary(true);
      setSheetStatus("ok");
      setLastSync(new Date().toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }));
      lastSyncTime.current = Date.now();
      
      // Cache in localStorage
      try { 
        localStorage.setItem("banva_dict", JSON.stringify(dict));
        localStorage.setItem("banva_sheet_url", url);
        localStorage.setItem("banva_last_sync", new Date().toISOString());
      } catch(e) {}
    } catch(err) {
      console.error("Sheet fetch error:", err);
      setSheetStatus("error");
      setError("Error cargando Sheet: " + err.message);
    } finally {
      setSheetLoading(false);
    }
  }, [parseCSV]);

  // Default Google Sheet URL (loads on all devices automatically)
  const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZxKcXM-OaJ5_B-lEM87PPy9B4675FRFLfpWtL-ZhTqpalZNqODq18XFY2C4txj7fXc5n1jYZSTWrJ/pub?gid=348421726&single=true&output=csv";

  // Load dictionary: always fetch from Sheet
  useEffect(() => {
    const url = localStorage.getItem("banva_sheet_url") || DEFAULT_SHEET_URL;
    setSheetUrl(url);
    fetchFromSheet(url);
  }, []);

  // Save dictionary to localStorage when it changes
  useEffect(() => {
    if (dictionary.length > 0) {
      try { localStorage.setItem("banva_dict", JSON.stringify(dictionary)); } catch(e) {}
    }
  }, [dictionary]);

  // ---- Image Upload (with compression for Vision API) ----
  const compressImage = useCallback((dataUrl, maxWidth = 2048, quality = 0.85) => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL("image/jpeg", quality);
        resolve(compressed);
      };
      img.onerror = () => reject(new Error("No se pudo cargar la imagen"));
      img.src = dataUrl;
    });
  }, []);

  const convertPdfToImage = useCallback(async (arrayBuffer) => {
    const pdfjsLib = await new Promise((resolve, reject) => {
      if (window.pdfjsLib) return resolve(window.pdfjsLib);
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      script.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      };
      script.onerror = () => reject(new Error("No se pudo cargar el visor de PDF"));
      document.head.appendChild(script);
    });

    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = Math.min(pdf.numPages, 5);
    const canvases = [];

    for (let i = 1; i <= totalPages; i++) {
      const page = await pdf.getPage(i);
      const scale = 2;
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      canvases.push(canvas);
    }

    const totalHeight = canvases.reduce((sum, c) => sum + c.height, 0);
    const maxWidth = Math.max(...canvases.map(c => c.width));
    const merged = document.createElement("canvas");
    merged.width = maxWidth;
    merged.height = totalHeight;
    const mCtx = merged.getContext("2d");
    let y = 0;
    for (const c of canvases) {
      mCtx.drawImage(c, 0, y);
      y += c.height;
    }

    return merged.toDataURL("image/jpeg", 0.85);
  }, []);

  const handleImageUpload = useCallback(async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    const isPdf = file.type === "application/pdf" || file.name.match(/\.pdf$/i);
    const validImageTypes = ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"];

    if (!isPdf && !validImageTypes.includes(file.type) && !file.name.match(/\.(jpe?g|png|webp|heic|heif)$/i)) {
      setError("Formato no soportado. Usa JPG, PNG, WebP o PDF.");
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      setError("Archivo demasiado grande (máx 20MB).");
      return;
    }

    try {
      if (isPdf) {
        setError(null);
        setProcessingStatus("Convirtiendo PDF a imagen...");
        const arrayBuffer = await file.arrayBuffer();
        const dataUrl = await convertPdfToImage(arrayBuffer);
        const compressed = await compressImage(dataUrl);
        setInvoiceImage(compressed);

  // ---- Dictionary Upload (CSV/TSV/XLSX) ----
  const handleDictUpload = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    
    const isExcel = file.name.match(/\.xlsx?$/i);
    const reader = new FileReader();
    
    if (isExcel) {
      reader.onload = async (ev) => {
        try {
          const XLSX = await loadXLSX();
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
          
          const dict = [];
          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || !row[0]) continue;
            const sku = String(row[0]).trim();
            const codigoML = row[1] ? String(row[1]).trim() : "";
            const nombre = row[2] ? String(row[2]).trim() : "";
            
            // Skip header
            if (i === 0 && (sku.toLowerCase().includes("sku") || sku.toLowerCase().includes("codigo"))) continue;
            if (sku && codigoML) dict.push({ sku, codigoML, nombre });
          }
          
          setDictionary(dict);
          setHasDictionary(dict.length > 0);
          setShowDictModal(false);
        } catch(err) {
          console.error(err);
          // Fallback: read as text
          const textReader = new FileReader();
          textReader.onload = (ev2) => parseDictionary(ev2.target.result);
          textReader.readAsText(file);
        }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = (ev) => parseDictionary(ev.target.result);
      reader.readAsText(file);
    }
  }, []);

    if (!invoiceImageBase64) return;

    setProcessing(true);
    setProcessingStatus("📷 Enviando imagen a Google Vision OCR...");
    setError(null);
    setStep("processing");

    try {
      // Send image to Vision+Claude pipeline
      const skuListStr = dictionary.length > 0
        ? dictionary.slice(0, 300).map(d => d.sku).join(", ")
        : "";

      const imgSizeKB = Math.round(invoiceImageBase64.length * 0.75 / 1024);
      setProcessingStatus(`📷 Enviando imagen (${imgSizeKB}KB) a Google Vision OCR...`);

      const response = await fetch("/api/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          imageBase64: invoiceImageBase64,
          skuList: skuListStr
        })
      });

      let data;
      try {
        data = await response.json();
      } catch (parseErr) {
        throw new Error("El servidor no respondió correctamente. Intenta de nuevo.");
      }

      if (data.error) {
        const hint = data.hint ? `\n💡 ${data.hint}` : "";
        throw new Error(data.error + hint);
      }

      setProcessingStatus("🤖 Estructurando datos con IA...");

      // Parse Claude's response from the pipeline
      let parsed;
      if (data.mode === "vision+claude" && data.claudeResponse) {
        const text = data.claudeResponse.content?.map(c => c.text || "").join("") || "";
        const cleanJson = text.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
        
        try {
          parsed = JSON.parse(cleanJson);
        } catch(e) {
          const match = cleanJson.match(/\{[\s\S]*\}/);
          if (match) parsed = JSON.parse(match[0]);
          else throw new Error("No se pudo parsear la respuesta de la IA");
        }
      } else {
        // Fallback for legacy response format
        const text = data.content?.map(c => c.text || "").join("") || "";
        const cleanJson = text.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
        const match = cleanJson.match(/\{[\s\S]*\}/);
        parsed = JSON.parse(match ? match[0] : cleanJson);
      }
      
      setFolioFactura(parsed.folio || "");
      setProcessingStatus("Cruzando con diccionario de códigos ML...");
      
      // Cross-reference with dictionary - EXACT match only
      const enriched = (parsed.productos || []).map(p => {
        const skuUp = (p.sku || "").toUpperCase().trim();
        // Find ALL matches (same SKU proveedor can have multiple products: pack vs individual)
        const matches = dictionary.filter(d => d.sku.toUpperCase() === skuUp);
        const match = matches[0] || null;
        return {
          ...p,
          codigoML: match?.codigoML || "",
          nombreDict: match?.nombre || "",
          skuVenta: match?.skuVenta || "",
          cantPack: match?.cantPack || 1,
          isPack: match?.isPack || false,
          matched: !!match,
          matchType: match ? "exacto" : "",
          altCount: matches.length > 1 ? matches.length : 0,
          skuOriginal: ""
        };
      });
      
      const unmatched = enriched.filter(p => !p.matched);
      setUnmatchedProducts(unmatched);
      setExtractedProducts(enriched);
      setStep("review");
      
    } catch (err) {
      setError(err.message);
      setStep("upload");
    } finally {
      setProcessing(false);
    }
  }, [invoiceImageBase64, dictionary]);

  const parsePasteData = React.useMemo(() => {
    if (!pasteText || pasteText.trim().length < 3) return [];
    const lines = pasteText.split("\n").filter(l => l.trim());
    const items = [];
    for (let i = 0; i < lines.length; i++) {
      const parts = lines[i].split("\t").map(p => p.trim());
      if (parts.length < 3) continue;
      // Skip header
      if (i === 0 && (parts[0].toLowerCase().includes("sku") || parts[0].toLowerCase().includes("codigo"))) continue;
      
      const sku = parts[0] || "";
      const nombre = parts[1] || "";
      const cantidad = parseInt(parts[2]) || 0;
      const codigoML = (parts[3] || "").trim();
      
      if (!sku && !nombre) continue;
      if (cantidad <= 0) continue;
      
      // If no codigoML provided, try to find it in dictionary
      let finalCodigoML = codigoML;

      let skuVenta = sku;
      let matched = !!codigoML;
      
      if (!finalCodigoML && dictionary.length > 0) {

        if (dictMatch) {
          finalCodigoML = dictMatch.codigoML;
          finalNombre = dictMatch.nombre || nombre;
          skuVenta = dictMatch.skuVenta || sku;
          matched = true;
        }
      }

    if (!showProdSeparators) pages = pages.filter(p => p.type !== "separator-product");
    setLabelPages(pages);
    setStep("labels");
    setProcessing(false);
    setPasteText("");
    setShowPasteMode(false);
  }, [parsePasteData, showCatSeparators, showProdSeparators]);

  // Inline product search results (for unmatched products)
  const productSearchResults = React.useMemo(() => {
    if (!productSearchQuery || productSearchQuery.length < 2 || dictionary.length === 0) return [];
    const q = productSearchQuery.toUpperCase();
    return dictionary.filter(d => 
      d.sku.toUpperCase().includes(q) || 
      (d.skuVenta || "").toUpperCase().includes(q) ||
      (d.nombre || "").toUpperCase().includes(q) ||
      (d.codigoML || "").toUpperCase().includes(q)
    ).slice(0, 6);
  }, [productSearchQuery, dictionary]);

  // Assign a dictionary item to a product
  const assignDictItem = useCallback((idx, dictItem) => {
    setExtractedProducts(prev => {
      const next = [...prev];
      next[idx] = {
        ...next[idx],
        sku: dictItem.sku,
        skuVenta: dictItem.skuVenta || dictItem.sku,
        codigoML: dictItem.codigoML,
        nombreDict: dictItem.nombre,
        cantPack: dictItem.cantPack || 1,
        isPack: dictItem.isPack || false,
        matched: true,
        matchType: "manual"
      };
      return next;
    });
    setProductSearchIdx(null);
    setProductSearchQuery("");
    setUnmatchedProducts(prev => prev.filter((_, i) => i !== idx));
  }, []);

  // ---- Step indicator progress ----
  // ---- Barcode Scanner for Verify Mode ----
  const stopScanner = useCallback(() => {
    if (html5QrCodeRef.current) {
      html5QrCodeRef.current.stop().catch(() => {});
      html5QrCodeRef.current.clear().catch(() => {});
      html5QrCodeRef.current = null;
    }
    setScannerActive(false);
  }, []);

  const onScanResult = useCallback((decodedText) => {
    const code = decodedText.trim().toUpperCase();
    // Look up scanned code in dictionary (match against codigoML)
    const match = dictionary.find(d => (d.codigoML || "").toUpperCase() === code);
    
    setVerifyResult({
      found: !!match,
      product: match || null,
      scannedCode: code
    });

    // Stop scanner after successful scan
    stopScanner();
  }, [dictionary, stopScanner]);

  const startScanner = useCallback(() => {
    setVerifyResult(null);
    setScannerActive(true);
    
    // Small delay to let the DOM render the scanner div
    setTimeout(() => {
      if (!document.getElementById("verify-scanner")) return;
      
      const html5QrCode = new Html5Qrcode("verify-scanner");
      html5QrCodeRef.current = html5QrCode;
      
      html5QrCode.start(
        { facingMode: "environment" },
        { 
          fps: 10, 
          qrbox: { width: 280, height: 120 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_39
          ]
        },
        onScanResult,
        () => {} // ignore errors (no barcode in frame)
      ).catch(err => {
        console.error("Scanner error:", err);
        setScannerActive(false);
        setError("No se pudo acceder a la cámara. Verifica los permisos.");
      });
    }, 300);
  }, [onScanResult]);

  // Clean up scanner when closing verify mode
  useEffect(() => {
    if (!showVerifyMode) stopScanner();
  }, [showVerifyMode, stopScanner]);

  const stepIndex = STEPS.indexOf(step);

  // ============================================================
  // RENDER
  // ============================================================
  return (
    <div style={styles.app}>
      {/* Header */}
      <div style={styles.header}>
        <div style={styles.headerInner}>

            <span style={styles.logoAccent}>BANVA</span>

              </button>

            {isAdmin ? (
              <button style={{...styles.dictBtn, borderColor: sheetUrl ? "rgba(34,197,94,0.3)" : "#2A2A30"}} onClick={() => setShowDictModal(true)}>
                {hasDictionary

                }
              </button>
            ) : (
              <span style={{fontSize: 12, color: "#666", padding: "6px 10px"}}>
                {hasDictionary ? `📊 ${dictionary.length} SKUs` : ""}
              </span>
            )}
            <button 
              style={{...styles.dictBtn, padding: "6px 10px", fontSize: 14, borderColor: isAdmin ? "rgba(34,197,94,0.3)" : "#2A2A30"}}

                if (isAdmin) { setIsAdmin(false); }

            </button>
          </div>
        </div>
        
        {/* Step indicator */}
        <div style={styles.steps}>
          {STEPS.map((s, i) => (

              <div style={{
                ...styles.stepDot,

              }}>
                {i < stepIndex ? "✓" : i + 1}
              </div>
              <span style={styles.stepLabel}>{STEP_LABELS[s]}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={styles.content}>
        {/* Error banner */}
        {error && (
          <div style={styles.errorBanner}>
            <span>⚠️ {error}</span>

        {/* ====================== STEP 1: UPLOAD ====================== */}
        {step === "upload" && (
          <div>
            {!hasDictionary && (

                <div style={{fontSize: 28}}>📕</div>

                  </p>

                        <button style={styles.removeBtn} onClick={() => removeQuickItem(idx)}>✕</button>
                      </div>

                        Sep. producto

                    </div>
                  </div>

            {/* ---- Paste from Excel mode ---- */}
            <div style={{marginTop: 16}}>

              {showPasteMode && (
                <div>
                  <textarea

                      width: "100%", minHeight: 120, padding: "10px 12px", fontSize: 12,
                      fontFamily: "monospace", background: "#0d0d10", color: "#E8E8EC",
                      border: "1px solid #2A2A30", borderRadius: 10, resize: "vertical",
                      lineHeight: 1.6
                    }}
                    placeholder={"Pega desde Excel (selecciona las celdas y Ctrl+V):\nSKU\tNombre\tCantidad\tCódigo ML\nTX2ALMPL15507\tPack Almohada Illusions\t6\tSCJN74629\nTXMTFIL1315GR\tManta Flannel Gris\t10\tUDVY31796"}
                    value={pasteText}
                    onChange={(e) => setPasteText(e.target.value)}
                  />

                  {parsePasteData.length > 0 && (
                    <div style={{marginTop: 8}}>
                      <div style={{fontSize: 12, color: "#888", marginBottom: 6}}>
                        {parsePasteData.length} productos detectados — {parsePasteData.filter(p => p.codigoML).length} con Código ML — {parsePasteData.reduce((s, p) => s + p.cantidad, 0)} unidades
                      </div>

                      <div style={{maxHeight: 180, overflow: "auto", borderRadius: 8, border: "1px solid #2A2A30"}}>
                        {parsePasteData.map((item, i) => (
                          <div key={i} style={{
                            display: "flex", alignItems: "center", gap: 8, padding: "6px 10px",
                            borderBottom: "1px solid #1a1a1f", fontSize: 11,
                            background: item.codigoML ? "transparent" : "rgba(245,158,11,0.05)"

                            <span style={{fontFamily: "monospace", color: item.codigoML ? "#3B82F6" : "#F59E0B", minWidth: 80, textAlign: "right"}}>

                        </div>

                      <button

                        🏷️ Generar {parsePasteData.filter(p => p.codigoML).reduce((s, i) => s + i.cantidad, 0)} Etiquetas
                      </button>

                      {/* Separator toggles */}
                      <div style={{display: "flex", gap: 12, marginTop: 8, flexWrap: "wrap"}}>

                        <label style={{display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 11, color: "#888"}}>

            {/* Verify label button */}
            <button 
              style={{...styles.secondaryBtn, marginTop: 16, width: "100%", padding: "12px", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center", gap: 8}}
              onClick={() => setShowVerifyMode(true)}

              📷 Verificar Etiqueta
            </button>
          </div>

        {/* ====================== STEP 2: PROCESSING ====================== */}
        {step === "processing" && (
          <div style={styles.processingCard}>
            <div style={styles.spinner}></div>
            <h3 style={{marginTop: 20}}>{processingStatus}</h3>

              Google Vision OCR → Claude IA
            </p>

                        <input
                          style={{...styles.fieldInput, fontSize: 13, padding: "8px 10px", borderRadius: 8, width: "100%", border: "1px solid rgba(245,158,11,0.4)", background: "#1a1a1f"}}
                          placeholder="🔍 Buscar producto por nombre, SKU o código ML..."
                          value={productSearchIdx === idx ? productSearchQuery : ""}
                          onFocus={() => { setProductSearchIdx(idx); setProductSearchQuery(""); }}
                          onChange={(e) => { setProductSearchIdx(idx); setProductSearchQuery(e.target.value); }}
                        />
                        
                        {productSearchIdx === idx && productSearchResults.length > 0 && (
                          <div style={{
                            position: "absolute", top: "100%", left: 0, right: 0, zIndex: 50,
                            background: "#1C1C20", border: "1px solid #333", borderRadius: 10,
                            marginTop: 4, maxHeight: 220, overflow: "auto", boxShadow: "0 8px 24px rgba(0,0,0,0.5)"
                          }}>
                            {productSearchResults.map((d, i) => (
                              <div 
                                key={i}
                                onClick={() => assignDictItem(idx, d)}
                                style={{padding: "8px 12px", cursor: "pointer", borderBottom: "1px solid #222", transition: "background 0.15s"}}
                                onMouseEnter={(e) => e.currentTarget.style.background = "#2A2A30"}
                                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
                              >
                                <div style={{display: "flex", justifyContent: "space-between", alignItems: "center"}}>
                                  <span style={{fontFamily: "monospace", fontWeight: 700, fontSize: 12, color: "#E8E8EC"}}>
                                    {d.skuVenta || d.sku}
                                    {d.isPack && <span style={{fontSize: 10, color: "#F59E0B", marginLeft: 6}}>📦x{d.cantPack}</span>}
                                  </span>
                                  <span style={{fontFamily: "monospace", fontSize: 11, color: "#3B82F6"}}>{d.codigoML}</span>
                                </div>
                                <div style={{fontSize: 11, color: "#888", marginTop: 1}}>{d.nombre || ""}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                  
                  <div style={styles.productFields}>
                    <div style={styles.fieldGroup}>
                      <label style={styles.fieldLabel}>Código ML</label>
                      <input
                        style={{...styles.fieldInput, borderColor: p.codigoML ? "rgba(34,197,94,0.4)" : "rgba(245,158,11,0.6)"}}
                        value={p.codigoML || ""}
                        onChange={(e) => updateProduct(idx, "codigoML", e.target.value.toUpperCase())}
                        placeholder="Ej: XZBN29596"
                      />
                    </div>
                    <div style={styles.fieldGroup}>
                      <label style={styles.fieldLabel}>Cantidad</label>
                      <input
                        style={styles.fieldInput}
                        type="number"
                        value={p.cantidad || ""}
                        onChange={(e) => updateProduct(idx, "cantidad", e.target.value)}
                        min="0"
                      />
                    </div>
                    <div style={styles.fieldGroup}>
                      <label style={styles.fieldLabel}>Costo</label>
                      <input
                        style={styles.fieldInput}
                        type="number"
                        value={p.costo || ""}
                        onChange={(e) => updateProduct(idx, "costo", e.target.value)}
                        min="0"
                      />
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <button style={styles.addBtn} onClick={addProduct}>+ Agregar producto</button>

            {/* Separator toggles */}
            <div style={{display: "flex", gap: 16, marginTop: 16, padding: "12px 14px", background: "#141416", borderRadius: 10, border: "1px solid #2A2A30"}}>
              <label style={{display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13, color: "#CCC"}}>
                <input type="checkbox" checked={showCatSeparators} onChange={(e) => setShowCatSeparators(e.target.checked)} style={{accentColor: "#3B82F6", width: 16, height: 16}} />
                Separadores de categoría
              </label>
              <label style={{display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13, color: "#CCC"}}>
                <input type="checkbox" checked={showProdSeparators} onChange={(e) => setShowProdSeparators(e.target.checked)} style={{accentColor: "#3B82F6", width: 16, height: 16}} />
                Separadores de producto
              </label>
            </div>

            <div style={{display: "flex", gap: 10, marginTop: 10}}>
              <button style={styles.secondaryBtn} onClick={() => setStep("upload")}>← Volver</button>
              <button 
                style={{...styles.primaryBtn, flex: 1}}
                onClick={generateLabels}
                disabled={processing}
              >
                🏷️ Generar Etiquetas ({extractedProducts.filter(p => p.codigoML).reduce((s, p) => s + p.cantidad, 0)} etiquetas)
              </button>
            </div>
          </div>
        )}

        {/* ====================== STEP 4: LABELS ====================== */}
        {step === "labels" && (
          <div>
            <div style={styles.successCard}>
              <div style={{fontSize: 56}}>🏷️</div>
              <h2 style={{marginTop: 12}}>¡Etiquetas Listas!</h2>
              <p style={{color: "#888", fontSize: 14, marginTop: 4}}>
                {labelPages.filter(p => p.type === "label").length} etiquetas + {labelPages.filter(p => p.type === "separator-category").length} separadores de categoría + {labelPages.filter(p => p.type === "separator-product").length} separadores de producto
              </p>
              <p style={{color: "#666", fontSize: 13, marginTop: 2}}>
                Total páginas: {labelPages.length} — Folio: {folioFactura || "N/A"}
              </p>
            </div>

            <button style={{...styles.primaryBtn, background: "#22C55E"}} onClick={downloadLabelsPDF}>
              📥 Descargar PDF Etiquetas
            </button>
            
            <button style={{...styles.secondaryBtn, width: "100%", marginTop: 10, borderColor: "rgba(139,92,246,0.4)", color: "#A78BFA"}} onClick={downloadSummary}>
              📋 Ver Hoja de Resumen
            </button>

            {/* Preview */}
            <div style={styles.previewGrid}>
              {labelPages.slice(0, 15).map((page, i) => (
                <div key={i} style={{
                  ...styles.labelPreview,
                  border: page.type === "separator-category" ? "2px solid #666" : 
                          page.type === "separator-product" ? "2px solid #3B82F6" : "1px solid #ddd"
                }}>
                  <img src={page.data} alt={`${page.type} ${i + 1}`} style={{width: "100%", borderRadius: 4}} />
                </div>
              ))}
              {labelPages.length > 15 && (
                <div style={{...styles.labelPreview, display: "flex", alignItems: "center", justifyContent: "center", background: "#1a1a1e", minHeight: 60}}>
                  <span style={{color: "#888", fontSize: 13}}>+{labelPages.length - 15} más</span>
                </div>
              )}
            </div>

            <div style={{display: "flex", gap: 10, marginTop: 16}}>
              <button style={styles.secondaryBtn} onClick={() => setStep("review")}>← Editar</button>
              <button style={{...styles.secondaryBtn, flex: 1}} onClick={() => {
                setStep("upload");
                setInvoiceImage(null);
                setInvoiceImageBase64(null);
                setExtractedProducts([]);
                setLabelPages([]);
                setFolioFactura("");
                setQuickItems([]);
                setQuickSearch("");
                setPasteText("");
                setShowPasteMode(false);
              }}>
                📄 Nueva Factura
              </button>
            </div>
          </div>
        )}
      </div>

      {/* ====================== VERIFY MODAL ====================== */}
      {showVerifyMode && (
        <div style={styles.modalOverlay} onClick={() => { setShowVerifyMode(false); }}>
          <div style={{...styles.modal, maxWidth: 400}} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <h3>📷 Verificar Etiqueta</h3>
              <button style={styles.modalClose} onClick={() => setShowVerifyMode(false)}>✕</button>
            </div>
            
            <p style={{fontSize: 12, color: "#888", margin: "8px 0 14px"}}>
              Escanea el código de barras de la etiqueta impresa para verificar que es correcto.
            </p>

            {/* Scanner area */}
            {!verifyResult && (
              <div>
                {!scannerActive ? (
                  <button 
                    style={{...styles.primaryBtn, width: "100%"}}
                    onClick={startScanner}
                  >
                    📷 Abrir Cámara
                  </button>
                ) : (
                  <div>
                    <div id="verify-scanner" style={{width: "100%", borderRadius: 10, overflow: "hidden"}}></div>
                    <button 
                      style={{...styles.secondaryBtn, width: "100%", marginTop: 8}}
                      onClick={stopScanner}
                    >
                      ✕ Cerrar cámara
                    </button>
                  </div>
                )}

                {/* Manual input fallback */}
                <div style={{marginTop: 14}}>
                  <div style={{display: "flex", gap: 8}}>
                    <input
                      style={{...styles.fieldInput, flex: 1, fontSize: 14, padding: "10px 12px"}}
                      placeholder="O tipea el código ML..."
                      onKeyDown={(e) => {
                        if (e.key === "Enter" && e.target.value.trim()) {
                          onScanResult(e.target.value.trim());
                          e.target.value = "";
                        }
                      }}
                    />
                    <button 
                      style={{...styles.primaryBtn, padding: "10px 16px", fontSize: 13}}
                      onClick={(e) => {
                        const input = e.target.previousElementSibling;
                        if (input && input.value.trim()) {
                          onScanResult(input.value.trim());
                          input.value = "";
                        }
                      }}
                    >
                      Buscar
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Result */}
            {verifyResult && (
              <div>
                {verifyResult.found ? (
                  <div style={{
                    padding: 20, borderRadius: 14, textAlign: "center",
                    background: "rgba(34,197,94,0.08)", border: "2px solid rgba(34,197,94,0.4)"
                  }}>
                    <div style={{fontSize: 56}}>✅</div>
                    <h3 style={{color: "#22C55E", margin: "10px 0 6px", fontSize: 18}}>Etiqueta Correcta</h3>
                    <div style={{fontFamily: "monospace", fontWeight: 700, fontSize: 20, color: "#E8E8EC", margin: "8px 0"}}>
                      {verifyResult.scannedCode}
                    </div>
                    <div style={{fontSize: 14, color: "#CCC", marginTop: 4}}>
                      {verifyResult.product.nombre}
                    </div>
                    <div style={{fontSize: 12, color: "#888", marginTop: 8}}>
                      SKU Venta: <span style={{fontFamily: "monospace", color: "#AAA"}}>{verifyResult.product.skuVenta || verifyResult.product.sku}</span>
                    </div>
                    <div style={{fontSize: 12, color: "#888", marginTop: 2}}>
                      SKU Proveedor: <span style={{fontFamily: "monospace", color: "#AAA"}}>{verifyResult.product.sku}</span>
                    </div>
                    {verifyResult.product.isPack && (
                      <div style={{fontSize: 13, color: "#F59E0B", marginTop: 6}}>📦 Pack x{verifyResult.product.cantPack}</div>
                    )}
                  </div>
                ) : (
                  <div style={{
                    padding: 20, borderRadius: 14, textAlign: "center",
                    background: "rgba(239,68,68,0.08)", border: "2px solid rgba(239,68,68,0.4)"
                  }}>
                    <div style={{fontSize: 56}}>❌</div>
                    <h3 style={{color: "#EF4444", margin: "10px 0 6px", fontSize: 18}}>No encontrado</h3>
                    <div style={{fontFamily: "monospace", fontWeight: 700, fontSize: 20, color: "#E8E8EC", margin: "8px 0"}}>
                      {verifyResult.scannedCode}
                    </div>
                    <p style={{fontSize: 13, color: "#888", marginTop: 8}}>
                      Este código no está en el diccionario. Verifica la etiqueta.
                    </p>
                  </div>
                )}

                <button 
                  style={{...styles.primaryBtn, width: "100%", marginTop: 14}}
                  onClick={() => { setVerifyResult(null); startScanner(); }}
                >
                  📷 Escanear otra
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ====================== PIN MODAL ====================== */}
      {showPinModal && (
        <div style={styles.modalOverlay} onClick={() => setShowPinModal(false)}>
          <div style={{...styles.modal, maxWidth: 320, textAlign: "center"}} onClick={(e) => e.stopPropagation()}>
            <div style={{fontSize: 48, marginBottom: 12}}>🔒</div>
            <h3 style={{margin: "0 0 8px", fontSize: 16}}>Modo Administrador</h3>
            <p style={{fontSize: 12, color: "#888", margin: "0 0 16px"}}>Ingresa el PIN para acceder a la configuración</p>
            <input
              type="password"
              inputMode="numeric"
              pattern="[0-9]*"
              maxLength={6}
              autoFocus
              style={{
                ...styles.fieldInput, fontSize: 24, textAlign: "center", letterSpacing: 8,
                padding: "12px", borderRadius: 10, width: "100%",
                borderColor: pinError ? "#EF4444" : "#2A2A30"
              }}
              value={pinInput}
              onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
              onKeyDown={(e) => {
                if (e.key === "Enter") {
                  if (pinInput === ADMIN_PIN) {
                    setIsAdmin(true);
                    setShowPinModal(false);
                  } else {
                    setPinError(true);
                  }
                }
              }}
              placeholder="••••"
            />
            {pinError && <p style={{fontSize: 12, color: "#EF4444", margin: "8px 0 0"}}>PIN incorrecto</p>}
            <div style={{display: "flex", gap: 10, marginTop: 16}}>
              <button style={styles.secondaryBtn} onClick={() => setShowPinModal(false)}>Cancelar</button>
              <button 
                style={{...styles.primaryBtn, flex: 1}}
                onClick={() => {
                  if (pinInput === ADMIN_PIN) {
                    setIsAdmin(true);
                    setShowPinModal(false);
                  } else {
                    setPinError(true);
                  }
                }}
              >
                Desbloquear
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ====================== DICTIONARY MODAL ====================== */}
      {showDictModal && (
        <div style={styles.modalOverlay} onClick={() => setShowDictModal(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <h3>📗 Diccionario SKU ↔ Código ML</h3>
              <button style={styles.modalClose} onClick={() => setShowDictModal(false)}>✕</button>
            </div>

            {/* ---- Google Sheets Connection ---- */}
            <div style={{marginTop: 14, padding: 14, background: "#0d1117", borderRadius: 12, border: sheetUrl ? "1px solid rgba(34,197,94,0.3)" : "1px solid #2A2A30"}}>
              <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 10}}>
                <span style={{fontSize: 20}}>📊</span>
                <div>
                  <div style={{fontSize: 14, fontWeight: 600}}>Google Sheets (recomendado)</div>
                  <div style={{fontSize: 11, color: "#888"}}>Se sincroniza automáticamente al abrir la app</div>
                </div>
              </div>

              <input
                style={{...styles.fieldInput, fontSize: 12, padding: "10px 12px", borderRadius: 8, width: "100%", marginBottom: 8}}
                placeholder="Pega la URL de tu Google Sheet publicado..."
                value={sheetUrl}
                onChange={(e) => setSheetUrl(e.target.value)}
              />

              <div style={{display: "flex", gap: 8}}>
                <button 
                  style={{...styles.primaryBtn, flex: 1, padding: "10px", fontSize: 13, opacity: sheetUrl ? 1 : 0.4}}
                  disabled={!sheetUrl || sheetLoading}
                  onClick={() => {
                    localStorage.setItem("banva_sheet_url", sheetUrl);
                    fetchFromSheet(sheetUrl);
                  }}
                >
                  {sheetLoading ? "⏳ Cargando..." : "🔄 Sincronizar"}
                </button>
                {sheetUrl && (
                  <button 
                    style={{...styles.secondaryBtn, padding: "10px", fontSize: 12}}
                    onClick={() => {
                      setSheetUrl("");
                      localStorage.removeItem("banva_sheet_url");
                      localStorage.removeItem("banva_last_sync");
                      setSheetStatus("");
                      setLastSync("");
                    }}
                  >
                    ✕
                  </button>
                )}
              </div>

              {sheetStatus === "ok" && (
                <div style={{fontSize: 11, color: "#22C55E", marginTop: 8}}>
                  ✅ Sincronizado: {dictionary.length} productos — última sync: {lastSync}
                </div>
              )}
              {sheetStatus === "error" && (
                <div style={{fontSize: 11, color: "#EF4444", marginTop: 8}}>
                  ❌ Error al cargar. Verifica que el Sheet esté publicado como CSV.
                </div>
              )}

              <details style={{marginTop: 10}}>
                <summary style={{fontSize: 11, color: "#666", cursor: "pointer"}}>¿Cómo publicar tu Google Sheet?</summary>
                <ol style={{fontSize: 11, color: "#888", margin: "8px 0 0", paddingLeft: 18, lineHeight: 1.8}}>
                  <li>Abre tu Google Sheet con columnas: <b>SKU | Código ML | Nombre</b></li>
                  <li>Menú <b>Archivo → Compartir → Publicar en la web</b></li>
                  <li>Selecciona la hoja y formato <b>CSV</b></li>
                  <li>Click <b>Publicar</b> y copia la URL</li>
                  <li>Pega la URL arriba y click Sincronizar</li>
                </ol>
              </details>
            </div>

            {/* ---- Divider ---- */}
            <div style={{display: "flex", alignItems: "center", gap: 12, margin: "16px 0"}}>
              <div style={{flex: 1, height: 1, background: "#2A2A30"}}></div>
              <span style={{fontSize: 11, color: "#444"}}>o carga manual</span>
              <div style={{flex: 1, height: 1, background: "#2A2A30"}}></div>
            </div>

            {/* ---- Manual upload ---- */}
            <div 
              style={styles.dictUploadZone}
              onClick={() => dictInputRef.current?.click()}
            >
              <div style={{fontSize: 24}}>📄</div>
              <p style={{fontSize: 12, margin: "4px 0 0"}}>Subir archivo CSV / Excel</p>
              <input ref={dictInputRef} type="file" accept=".csv,.tsv,.txt,.xlsx,.xls" onChange={handleDictUpload} style={{display: "none"}} />
            </div>

            <textarea
              style={{...styles.dictTextarea, marginTop: 10}}
              placeholder={"SKU\tCódigo ML\tNombre\nJSAFAB413P20W\tLXXI15548\tSabanas AF 144H"}
              value={dictText}
              onChange={(e) => setDictText(e.target.value)}
              rows={4}
            />

            <div style={{display: "flex", gap: 10, marginTop: 8}}>
              <button style={styles.secondaryBtn} onClick={() => setShowDictModal(false)}>Cerrar</button>
              <button 
                style={{...styles.primaryBtn, flex: 1}}
                onClick={() => parseDictionary(dictText)}
                disabled={!dictText.trim()}
              >
                Cargar texto ({dictText.split("\n").filter(l => l.trim()).length - 1} items)
              </button>
            </div>

            {/* ---- Current dictionary status ---- */}
            {hasDictionary && (
              <div style={{marginTop: 14, padding: 12, background: "#0f2d0f", borderRadius: 10, border: "1px solid rgba(34,197,94,0.3)"}}>
                <div style={{display: "flex", justifyContent: "space-between", alignItems: "center"}}>
                  <p style={{fontSize: 13, color: "#22C55E", margin: 0}}>
                    ✅ {dictionary.length} productos cargados
                  </p>
                  {sheetUrl && (
                    <button 
                      style={{background: "none", border: "none", color: "#3B82F6", fontSize: 12, cursor: "pointer", fontFamily: "inherit"}}
                      onClick={() => fetchFromSheet(sheetUrl)}
                    >
                      🔄 Refrescar
                    </button>
                  )}
                </div>
                <div style={{maxHeight: 120, overflow: "auto", marginTop: 8}}>
                  {dictionary.slice(0, 8).map((d, i) => (
                    <div key={i} style={{fontSize: 11, color: "#888", fontFamily: "monospace", padding: "2px 0"}}>
                      {d.sku}{d.skuVenta && d.skuVenta !== d.sku ? ` (venta: ${d.skuVenta})` : ""} → {d.codigoML} {d.nombre ? `— ${d.nombre}` : ""}{d.isPack ? ` 📦x${d.cantPack}` : ""}
                    </div>
                  ))}
                  {dictionary.length > 8 && <div style={{fontSize: 11, color: "#666"}}>... y {dictionary.length - 8} más</div>}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Spinner keyframes */}
      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input:focus, textarea:focus { outline: none; border-color: #3B82F6 !important; }
      `}</style>
    </div>
  );
}
